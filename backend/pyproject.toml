[project]
name = "team08-e26-backend"
version = "0.1.0"
description = "Yonnov'IA scientific article scraping platform - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.2",
    "rapidfuzz>=3.9.0",
    "scikit-learn>=1.5.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pinned to the exact rule codes this codebase already conforms to, rather
# than relying on ruff's default rule set (which can silently grow across
# ruff releases and break CI with no code change — see EP-01 CI incident).
# Base pyflakes/pycodestyle correctness checks plus the specific
# bugbear/pyupgrade/simplify/tryceratops/comprehensions/ruff-native rules
# already enforced. Expand deliberately, not implicitly.
select = [
    "E4", "E7", "E9", "F",
    "B008", "C408", "I001", "RUF100",
    "SIM102", "TRY203", "UP017", "UP031", "UP035", "UP045",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Path",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]